</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="mark">KZ</div><div><b>KZ Optimizer</b><div class="sub">BIOS GUIDE · MSI CLICK BIOS 5</div></div></div><div class="lang-picker"><label for="lang" id="langlabel">Langue</label><select id="lang" aria-label="Langue du guide"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="es">🇪🇸 Español</option><option value="de">🇩🇪 Deutsch</option><option value="pt">🇵🇹 Português</option><option value="it">🇮🇹 Italiano</option></select></div></header><section class="hero"><div class="eyebrow" id="eyebrow">GUIDE MÉMOIRE · DDR4</div><h1 id="heroTitle">Optimiser sa RAM, étape par étape.</h1><p id="heroDesc">Un accompagnement visuel pendant le passage dans le BIOS, avec des captures authentiques et des conseils de sécurité.</p></section><div id="track" class="track" aria-label="Progression"></div><section class="panel"><div class="panelhead"><span class="stepcount" id="count"></span><span class="tiny" id="phase"></span></div><div class="imagebox" id="visual"></div><div class="content"><h2 id="title"></h2><p id="description"></p><div class="note" id="warning"></div></div></section><div class="actions"><button class="btn" id="prev">← Précédent</button><button class="btn primary" id="next">Suivant →</button></div><div class="aux"><span class="tiny" id="saved">Progression enregistrée sur cet appareil</span><button class="textbtn" id="zoom">Agrandir la capture ↗</button></div><details><summary id="helpTitle">⚠️ Aide : si le PC devient instable</summary><p id="helpBody"></p></details><div class="footer" id="footer"></div></main><dialog id="lightbox"><button class="btn close" id="close">Fermer ✕</button><img id="large" alt="Capture BIOS agrandie"></dialog><script>
const translations={"fr":{"eyebrow":"GUIDE MÉMOIRE · DDR4","hero":"Optimiser sa RAM, étape par étape.","intro":"Un accompagnement visuel pendant le passage dans le BIOS, avec des captures authentiques et des conseils de sécurité.","language":"Langue","step":"ÉTAPE","remember":"À retenir :","prev":"← Précédent","next":"Suivant →","restart":"Recommencer ↺","saved":"Progression enregistrée sur cet appareil","zoom":"Agrandir la capture ↗","close":"Fermer ✕","placeholder":"Consignes à lire avant de continuer","help":"⚠️ Aide : si le PC devient instable","helpBody":"Un profil XMP n'est jamais garanti stable. Si Windows démarre, revenez dans le BIOS et restaurez les paramètres précédents. Si le PC ne démarre plus, consultez la procédure officielle de récupération du BIOS et de remise à zéro CMOS de votre carte mère, en respectant les précautions d'alimentation. Ne modifiez pas les tensions au hasard. Si nécessaire, faites-vous accompagner par une personne qualifiée.","footer":"Guide pédagogique non affilié à MSI · Les modifications du BIOS restent manuelles · KZ Optimizer","phases":["Préparation","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","Retour sous Windows","Vérification sous Windows"],"titles":["Préparer l’accès au BIOS","Accéder au menu OC","Repérer le réglage A-XMP","Examiner les profils proposés","Vérifier avant de sauvegarder","Contrôler la fréquence et la stabilité","Lire la vitesse de la RAM dans le Gestionnaire des tâches"],"descs":["Notez vos paramètres mémoire actuels et gardez une trace des réglages d’origine. Branchez votre téléphone sur secteur si nécessaire : il servira de guide pendant que votre PC sera redémarré. Sous Windows 11 : Paramètres → Système → Récupération → Démarrage avancé → Redémarrer maintenant, puis Dépannage → Options avancées → Paramètres du microprogramme UEFI.","Depuis l’écran principal de MSI Click BIOS 5, sélectionnez « OC » dans le menu de gauche pour afficher les réglages de performance et de mémoire.","Dans le menu OC, repérez la section « DRAM Setting » puis la ligne « A-XMP ». La capture montre A-XMP désactivé et la fréquence DRAM réglée séparément à DDR4-3200.","Ouvrez le menu A-XMP pour voir les choix « Disabled », « Profile 1 » et « Profile 2 ». Vérifiez les caractéristiques du profil avant de décider de l’activer.","Appuyez sur F10 pour afficher la fenêtre de confirmation. Lisez la liste des changements proposés avant de sélectionner « Yes ». Si rien ne doit être modifié, quittez sans enregistrer.","Après le redémarrage, ouvrez le Gestionnaire des tâches → Performances → Mémoire pour vérifier la fréquence. Effectuez ensuite un test mémoire adapté, par exemple avec OCCT, et surveillez les erreurs et les comportements inhabituels.","Appuyez sur Ctrl + Maj + Échap pour ouvrir le Gestionnaire des tâches. Suivez les repères des captures, puis comparez la vitesse affichée sur votre PC au réglage choisi dans le BIOS."],"warnings":["Avant de redémarrer, enregistrez votre travail et assurez-vous de disposer de votre clé de récupération BitLocker si le chiffrement est activé.","Les menus peuvent varier selon le modèle de carte mère et la version du BIOS.","La fréquence DDR4-3200 affichée ici est un réglage manuel ; elle ne signifie pas que le profil XMP est activé.","Sur la configuration ayant servi aux captures, le profil DDR4-3600 a généré des erreurs lors d’un test mémoire. Ne considérez jamais un profil comme automatiquement stable.","Cette capture de démonstration indique qu’aucun réglage n’a été changé. Lors d’une vraie modification, vérifiez attentivement les différences affichées.","Si le test signale des erreurs, restaurez les paramètres précédemment stables. Un test court sans erreur ne garantit pas une stabilité absolue.","La valeur de 3200 MHz est celle du PC illustré. La vitesse affichée ne suffit pas à confirmer que le profil XMP est actif."],"calls":["1 · Ouvrir OC","2 · Repérer A-XMP","3 · Examiner les profils","4 · Contrôler la confirmation"],"windowsCaptions":["Depuis Processus, sélectionnez Performance.","Sélectionnez Mémoire, puis lisez la ligne « Vitesse »."]},"en":{"eyebrow":"MEMORY GUIDE · DDR4","hero":"Optimize your RAM, step by step.","intro":"A visual walkthrough for BIOS settings, using authentic screenshots and safety guidance.","language":"Language","step":"STEP","remember":"Important:","prev":"← Previous","next":"Next →","restart":"Start again ↺","saved":"Progress saved on this device","zoom":"Enlarge screenshot ↗","close":"Close ✕","placeholder":"Read the instructions before continuing","help":"⚠️ Help: if your PC becomes unstable","helpBody":"An XMP profile is never guaranteed to be stable. If Windows starts, return to the BIOS and restore your previous settings. If the PC no longer boots, consult your motherboard’s official BIOS recovery and CMOS reset instructions, following all power safety precautions. Do not change voltages at random. Seek qualified assistance if necessary.","footer":"Educational guide, not affiliated with MSI · BIOS changes are manual · KZ Optimizer","phases":["Preparation","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","Back in Windows","Windows verification"],"titles":["Prepare to enter the BIOS","Open the OC menu","Locate the A-XMP setting","Review available profiles","Check before saving","Check memory speed and stability","Read your RAM speed in Task Manager"],"descs":["Record your current memory settings and keep a copy of the original values. Charge your phone if needed: it will guide you while the PC restarts. On Windows 11: Settings → System → Recovery → Advanced startup → Restart now, then Troubleshoot → Advanced options → UEFI Firmware Settings.","On the main MSI Click BIOS 5 screen, select “OC” in the left menu to display performance and memory settings.","In the OC menu, find “DRAM Setting” and then “A-XMP”. The screenshot shows A-XMP disabled and DRAM frequency set separately to DDR4-3200.","Open the A-XMP menu to view “Disabled”, “Profile 1” and “Profile 2”. Check the profile specifications before deciding whether to enable one.","Press F10 to open the confirmation window. Read the proposed changes before selecting “Yes”. If you do not intend to change anything, exit without saving.","After restarting, open Task Manager → Performance → Memory to check the speed. Run a suitable memory test, such as OCCT, and watch for errors or unusual behavior.","Press Ctrl + Shift + Esc to open Task Manager. Follow the markers in the screenshots, then compare the speed on your PC with the setting you chose in the BIOS."],"warnings":["Save your work before restarting and make sure your BitLocker recovery key is available if encryption is enabled.","Menus may differ depending on your motherboard model and BIOS version.","DDR4-3200 shown here is a manual setting; it does not mean XMP is enabled.","On the system used for these screenshots, the DDR4-3600 profile produced memory test errors. Never assume an available profile is stable.","This example screenshot shows that no BIOS settings were changed. If you make a change, carefully review the differences shown.","If the test reports errors, restore the previously stable settings. A short error-free test cannot guarantee complete stability.","The example PC shows 3200 MHz. The reported speed alone cannot confirm whether XMP is enabled."],"calls":["1 · Open OC","2 · Find A-XMP","3 · Review profiles","4 · Check confirmation"],"windowsCaptions":["From Processes, select Performance.","Select Memory, then read the Speed field."]},"es":{"eyebrow":"GUÍA DE MEMORIA · DDR4","hero":"Optimiza tu RAM, paso a paso.","intro":"Una guía visual para configurar la BIOS con capturas auténticas y consejos de seguridad.","language":"Idioma","step":"PASO","remember":"Importante:","prev":"← Anterior","next":"Siguiente →","restart":"Empezar de nuevo ↺","saved":"Progreso guardado en este dispositivo","zoom":"Ampliar captura ↗","close":"Cerrar ✕","placeholder":"Lee las instrucciones antes de continuar","help":"⚠️ Ayuda: si el PC se vuelve inestable","helpBody":"No se garantiza la estabilidad de ningún perfil XMP. Si Windows arranca, vuelve a la BIOS y restaura los ajustes anteriores. Si el PC ya no arranca, consulta las instrucciones oficiales de recuperación de BIOS y restablecimiento de CMOS de tu placa base, siguiendo las precauciones de alimentación. No cambies voltajes al azar. Solicita ayuda profesional si es necesario.","footer":"Guía educativa no afiliada a MSI · Los cambios en la BIOS son manuales · KZ Optimizer","phases":["Preparación","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","De vuelta en Windows","Verificación en Windows"],"titles":["Prepararse para entrar en la BIOS","Abrir el menú OC","Localizar el ajuste A-XMP","Revisar los perfiles disponibles","Comprobar antes de guardar","Comprobar velocidad y estabilidad","Consultar la velocidad de la RAM en el Administrador de tareas"],"descs":["Anota los ajustes actuales de memoria y guarda los valores originales. Carga el teléfono si es necesario: te servirá de guía mientras se reinicia el PC. En Windows 11: Configuración → Sistema → Recuperación → Inicio avanzado → Reiniciar ahora; después, Solucionar problemas → Opciones avanzadas → Configuración de firmware UEFI.","En la pantalla principal de MSI Click BIOS 5, selecciona «OC» en el menú izquierdo para ver los ajustes de rendimiento y memoria.","En el menú OC, busca «DRAM Setting» y luego «A-XMP». La captura muestra A-XMP desactivado y la frecuencia DRAM configurada por separado en DDR4-3200.","Abre el menú A-XMP para ver «Disabled», «Profile 1» y «Profile 2». Comprueba las características antes de activar un perfil.","Pulsa F10 para abrir la confirmación. Revisa los cambios antes de seleccionar «Yes». Si no quieres modificar nada, sal sin guardar.","Tras reiniciar, abre Administrador de tareas → Rendimiento → Memoria para comprobar la velocidad. Realiza una prueba de memoria, por ejemplo con OCCT, y vigila los errores o comportamientos extraños.","Pulsa Ctrl + Mayús + Esc para abrir el Administrador de tareas. Sigue las indicaciones de las capturas y compara la velocidad de tu equipo con el ajuste que elegiste en la BIOS."],"warnings":["Guarda tu trabajo y asegúrate de tener la clave de recuperación de BitLocker si el cifrado está activado.","Los menús pueden variar según la placa base y la versión de BIOS.","DDR4-3200 es aquí un ajuste manual; no significa que XMP esté activado.","En el equipo usado para estas capturas, el perfil DDR4-3600 produjo errores en una prueba de memoria. No supongas que un perfil disponible es estable.","Esta captura de ejemplo indica que no se cambió ningún ajuste. Si realizas cambios, revisa atentamente las diferencias mostradas.","Si la prueba muestra errores, restaura los ajustes previamente estables. Una prueba corta sin errores no garantiza estabilidad total.","El equipo del ejemplo muestra 3200 MHz. La velocidad por sí sola no permite confirmar si XMP está activado."],"calls":["1 · Abrir OC","2 · Buscar A-XMP","3 · Revisar perfiles","4 · Comprobar confirmación"],"windowsCaptions":["Desde Procesos, selecciona Rendimiento.","Selecciona Memoria y consulta el campo «Velocidad»."]},"de":{"eyebrow":"ARBEITSSPEICHER-GUIDE · DDR4","hero":"RAM Schritt für Schritt optimieren.","intro":"Eine bebilderte BIOS-Anleitung mit echten Screenshots und Sicherheitshinweisen.","language":"Sprache","step":"SCHRITT","remember":"Wichtig:","prev":"← Zurück","next":"Weiter →","restart":"Neu beginnen ↺","saved":"Fortschritt auf diesem Gerät gespeichert","zoom":"Screenshot vergrößern ↗","close":"Schließen ✕","placeholder":"Vor dem Fortfahren Hinweise lesen","help":"⚠️ Hilfe: Wenn der PC instabil wird","helpBody":"Die Stabilität eines XMP-Profils ist nie garantiert. Wenn Windows startet, stelle im BIOS die vorherigen Einstellungen wieder her. Falls der PC nicht mehr startet, lies die offiziellen Anweisungen deines Mainboards zur BIOS-Wiederherstellung und zum CMOS-Reset und beachte alle Sicherheitsregeln zur Stromversorgung. Ändere Spannungen nicht auf Verdacht. Hole bei Bedarf fachkundige Hilfe.","footer":"Unabhängige Lernhilfe, nicht mit MSI verbunden · BIOS-Änderungen erfolgen manuell · KZ Optimizer","phases":["Vorbereitung","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","Zurück in Windows","Überprüfung unter Windows"],"titles":["BIOS-Zugriff vorbereiten","OC-Menü öffnen","A-XMP-Einstellung finden","Verfügbare Profile prüfen","Vor dem Speichern prüfen","Speichertakt und Stabilität prüfen","RAM-Geschwindigkeit im Task-Manager ablesen"],"descs":["Notiere die aktuellen Speichereinstellungen und sichere die ursprünglichen Werte. Lade bei Bedarf dein Smartphone auf: Es dient während des Neustarts als Anleitung. Unter Windows 11: Einstellungen → System → Wiederherstellung → Erweiterter Start → Jetzt neu starten; dann Problembehandlung → Erweiterte Optionen → UEFI-Firmwareeinstellungen.","Wähle im Hauptbildschirm von MSI Click BIOS 5 links „OC“, um Leistungs- und Speichereinstellungen anzuzeigen.","Suche im OC-Menü nach „DRAM Setting“ und „A-XMP“. Im Screenshot ist A-XMP deaktiviert; der DRAM-Takt wurde separat auf DDR4-3200 eingestellt.","Öffne A-XMP, um „Disabled“, „Profile 1“ und „Profile 2“ zu sehen. Prüfe die Profilwerte, bevor du ein Profil aktivierst.","Drücke F10, um die Bestätigung zu öffnen. Prüfe die vorgeschlagenen Änderungen vor „Yes“. Wenn du nichts ändern möchtest, verlasse das BIOS ohne Speichern.","Öffne nach dem Neustart Task-Manager → Leistung → Arbeitsspeicher, um den Takt zu prüfen. Führe einen Speichertest durch, etwa mit OCCT, und achte auf Fehler oder ungewöhnliches Verhalten.","Drücke Strg + Umschalt + Esc, um den Task-Manager zu öffnen. Folge den Markierungen in den Screenshots und vergleiche die angezeigte Geschwindigkeit mit deiner BIOS-Einstellung."],"warnings":["Speichere deine Arbeit und halte den BitLocker-Wiederherstellungsschlüssel bereit, falls Verschlüsselung aktiviert ist.","Die Menüs können je nach Mainboard-Modell und BIOS-Version abweichen.","DDR4-3200 ist hier manuell eingestellt; XMP ist dadurch nicht automatisch aktiviert.","Auf dem System dieser Screenshots verursachte das DDR4-3600-Profil Fehler im Speichertest. Ein verfügbares Profil ist nicht zwangsläufig stabil.","Der Beispielscreenshot zeigt, dass keine BIOS-Einstellungen geändert wurden. Prüfe bei tatsächlichen Änderungen die angezeigten Unterschiede sorgfältig.","Wenn Fehler auftreten, stelle die zuvor stabilen Einstellungen wieder her. Ein kurzer fehlerfreier Test garantiert keine vollständige Stabilität.","Der Beispiel-PC zeigt 3200 MHz an. An der Geschwindigkeit allein lässt sich nicht erkennen, ob XMP aktiviert ist."],"calls":["1 · OC öffnen","2 · A-XMP finden","3 · Profile prüfen","4 · Bestätigung prüfen"],"windowsCaptions":["Wechsle von „Prozesse“ zu „Leistung“.","Wähle „Arbeitsspeicher“ und lies den Wert unter „Geschwindigkeit“ ab."]},"pt":{"eyebrow":"GUIA DE MEMÓRIA · DDR4","hero":"Otimiza a RAM, passo a passo.","intro":"Um guia visual para a BIOS com capturas autênticas e recomendações de segurança.","language":"Idioma","step":"PASSO","remember":"Importante:","prev":"← Anterior","next":"Seguinte →","restart":"Recomeçar ↺","saved":"Progresso guardado neste dispositivo","zoom":"Ampliar captura ↗","close":"Fechar ✕","placeholder":"Lê as instruções antes de continuar","help":"⚠️ Ajuda: se o PC ficar instável","helpBody":"A estabilidade de um perfil XMP nunca é garantida. Se o Windows arrancar, regressa à BIOS e repõe as definições anteriores. Se o PC deixar de arrancar, consulta as instruções oficiais da tua motherboard para recuperar a BIOS e repor o CMOS, respeitando as precauções de alimentação elétrica. Não alteres tensões ao acaso. Procura ajuda qualificada se necessário.","footer":"Guia educativo sem afiliação à MSI · As alterações à BIOS são manuais · KZ Optimizer","phases":["Preparação","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","MSI Click BIOS 5","Regresso ao Windows","Verificação no Windows"],"titles":["Preparar o acesso à BIOS","Abrir o menu OC","Localizar a definição A-XMP","Analisar os perfis disponíveis","Verificar antes de guardar","Verificar velocidade e estabilidade","Consultar a velocidade da RAM no Gestor de Tarefas"],"descs":["Anota as definições atuais da memória e guarda os valores originais. Carrega o telemóvel, se necessário: será o teu guia durante o reinício do PC. No Windows 11: Definições → Sistema → Recuperação → Arranque avançado → Reiniciar agora; depois Resolução de problemas → Opções avançadas → Definições de firmware UEFI.","No ecrã principal do MSI Click BIOS 5, seleciona «OC» no menu esquerdo para ver as definições de desempenho e memória.","No menu OC, procura «DRAM Setting» e depois «A-XMP». A captura mostra A-XMP desativado e a frequência DRAM definida separadamente como DDR4-3200.","Abre A-XMP para ver «Disabled», «Profile 1» e «Profile 2». Verifica as características antes de ativares um perfil.","Prime F10 para abrir a confirmação. Lê as alterações propostas antes de selecionar «Yes». Se não quiseres alterar nada, sai sem guardar.","Após reiniciar, abre Gestor de Tarefas → Desempenho → Memória para verificar a velocidade. Faz um teste de memória, por exemplo com OCCT, e verifica se há erros ou comportamentos invulgares.","Prime Ctrl + Shift + Esc para abrir o Gestor de Tarefas. Segue as indicações nas capturas e compara a velocidade apresentada no teu PC com a definição que escolheste na BIOS."],"warnings":["Guarda o teu trabalho e certifica-te de que tens a chave de recuperação BitLocker, se a encriptação estiver ativa.","Os menus podem variar consoante a motherboard e a versão da BIOS.","DDR4-3200 é aqui uma definição manual; não significa que o XMP esteja ativo.","No sistema destas capturas, o perfil DDR4-3600 causou erros num teste de memória. Um perfil disponível não é necessariamente estável.","Esta captura de exemplo indica que não foram feitas alte const $=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const supported=Object.keys(translations);const storedLang=localStorage.getItem('kz_bios_lang');const browserLang=(navigator.language||'fr').split('-')[0].toLowerCase();let language=supported.includes(storedLang)?storedLang:(supported.includes(browserLang)?browserLang:'en');let t=translations[language];$('lang').value=language;
$('lang').addEventListener('change',e=>{language=e.target.value;t=translations[language];localStorage.setItem('kz_bios_lang',language);render()});
let current=Number(localStorage.getItem('kz_bios_step')||0);if(!Number.isInteger(current)||current<0||current>=slides.length)current=0;
function openZoom(src, caption, windowsCapture = false) {
    const dialog = $('lightbox');
    $('large').src = src;
    $('large').alt = caption;
    dialog.setAttribute('aria-label', caption);
    dialog.classList.toggle('windows-zoom', windowsCapture);
    dialog.showModal();
}

function renderWindowsScreenshots(sources) {
    const gallery = document.createElement('div');
    gallery.className = 'windows-gallery';
    sources.forEach((src, i) => {
        const caption = t.windowsCaptions[i];
        const figure = document.createElement('figure');
        const label = document.createElement('figcaption');
        const instruction = document.createElement('b');
        instruction.textContent = String(i + 1) + '. ' + caption;
        const zoom = document.createElement('button');
        zoom.type = 'button';
        zoom.className = 'textbtn';
        zoom.textContent = t.zoom;
        zoom.setAttribute('aria-label', t.zoom + ' — ' + caption);
        zoom.onclick = () => openZoom(src, caption, true);
        const image = document.createElement('img');
        image.src = src;
        image.alt = caption;
        label.append(instruction, zoom);
        figure.append(label, image);
        gallery.append(figure);
    });
    $('visual').replaceChildren(gallery);
}

function render(){const s=slides[current];document.documentElement.lang=language;document.title=`KZ BIOS Guide — ${language.toUpperCase()}`;
$('langlabel').textContent=t.language;$('lang').setAttribute('aria-label',t.language);$('eyebrow').textContent=t.eyebrow;$('heroTitle').textContent=t.hero;$('heroDesc').textContent=t.intro;
$('count').textContent=`${t.step} ${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;$('phase').textContent=t.phases[current];$('title').textContent=t.titles[current];$('description').textContent=t.descs[current];$('warning').innerHTML='<strong>'+esc(t.remember)+'</strong> '+esc(t.warnings[current]);
$('track').innerHTML=slides.map((_,i)=>`<span class="segment ${i<=current?'done':''}"></span>`).join('');$('prev').disabled=current===0;$('prev').textContent=t.prev;$('next').textContent=current===slides.length-1?t.restart:t.next;$('zoom').textContent=t.zoom;$('zoom').hidden=!s.img;$('saved').textContent=t.saved;$('helpTitle').textContent=t.help;$('helpBody').textContent=t.helpBody;$('footer').textContent=t.footer;$('close').textContent=t.close;$('large').alt=t.zoom;
if(s.screenshots){renderWindowsScreenshots(s.screenshots)}else if(s.img){const [x1,y1,x2,y2]=s.box;$('visual').innerHTML=`<div class="bios"><img src="${s.img}" alt="MSI Click BIOS 5"><div class="annot"><svg viewBox="0 0 1024 768" preserveAspectRatio="none" aria-hidden="true"><rect class="focus" x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="7"/></svg><div class="callout" style="left:${s.callPos[0]}%;top:${s.callPos[1]}%">${esc(t.calls[current-1])}</div></div></div>`}else{$('visual').innerHTML=`<div class="placeholder"><span class="symbol">${s.symbol}</span><b>${esc(t.phases[current])}</b><span class="tiny">${esc(t.placeholder)}</span></div>`}localStorage.setItem('kz_bios_step',String(current));}
$('prev').onclick=()=>{current=Math.max(0,current-1);render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{current=(current+1)%slides.length;render();window.scrollTo({top:0,behavior:'smooth'})};$('zoom').onclick=()=>{const s=slides[current];if(s.img)openZoom(s.img,t.titles[current])};$('close').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};render();
</script></body></html>
